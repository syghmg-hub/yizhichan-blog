<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>一只蝉 · 写作后台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 用绝对路径指定配置文件：避免访问 /admin（无斜杠）时相对路径解析错误 -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <style>
      /* 脚本加载前的兜底样式，admin.css 未生效时也不会白屏 */
      html,
      body {
        margin: 0;
        background: #f7f5f0;
      }
    </style>
  </head>
  <body>
    <header class="cms-head">
      <a class="cms-brand" href="/"><span class="mark">♪</span> 一只蝉</a>
      <span class="cms-head-title">写作后台</span>
      <nav>
        <a href="/write/">使用说明</a>
        <a href="/">返回博客</a>
      </nav>
    </header>

    <p class="cms-tip">
      <b>怎么发文章：</b>左侧选「随笔」或「技术笔记」→ 点「新增」→ 填标题和摘要 → 在正文框里写（支持 Markdown，
      <code>## 标题</code>、<code>**加粗**</code>、<code>- 列表</code>）→ 插图用正文框上方工具栏的「图片」按钮 →
      点「保存」→ 等约 1 分钟线上自动更新。手机浏览器也能用。
    </p>

    <div id="cms-boot">
      <div class="dot"></div>
      <div>正在加载写作后台…</div>
      <div>若超过 20 秒仍在转圈，请查看 <a href="/write/">写作说明</a></div>
    </div>

    <!-- turbo-github 后端仅在 beta 版发布，因此必须用 beta 版 Decap；固定具体版本号避免 beta 升级带来破坏性变更 -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0-beta.2/dist/decap-cms.js"></script>
    <script>
      // Decap 挂载完成后移除加载占位，避免它一直占着页面顶部
      (function () {
        var boot = document.getElementById('cms-boot');
        if (!boot) return;
        var removed = false;
        var remove = function () {
          if (removed || !boot.parentNode) return;
          removed = true;
          boot.parentNode.removeChild(boot);
          observer.disconnect();
        };
        var mounted = function () {
          var root = document.getElementById('nc-root');
          return root && root.childElementCount > 0;
        };
        var observer = new MutationObserver(function () {
          if (mounted()) remove();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        // 兜底：20 秒后无论如何都移除，避免加载失败时整页被遮住
        setTimeout(remove, 20000);
      })();
    </script>
  </body>
</html>
