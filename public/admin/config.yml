# 一只蝉 · 写作后台配置
# 界面语言：简体中文
# 内容仍然保存在 GitHub 仓库的 src/content/posts 目录，保存即触发 Vercel 自动部署

backend:
  name: turbo-github
  turbo_site_id: 948f5af6-97d0-47ea-9750-133811961234
  branch: main
  deploy_status: false
  commit_messages:
    create: '写作：新建 {{collection}}「{{slug}}」'
    update: '写作：更新 {{collection}}「{{slug}}」'
    delete: '写作：删除 {{collection}}「{{slug}}」'
    uploadMedia: '写作：上传图片 {{path}}'
    deleteMedia: '写作：删除图片 {{path}}'

site_url: https://yizhichan-blog.vercel.app
display_url: https://yizhichan-blog.vercel.app
logo:
  src: https://yizhichan-blog.vercel.app/favicon.svg
  show_in_header: true

locale: zh_Hans

# 保存即发布（不做审核草稿流，个人博客够用）
publish_mode: simple

# 预览链接指向的是英文路径，与本博客的中文转拼音网址不一致，故关闭避免误点
show_preview_links: false

# 图片上传：存进仓库的 public/uploads/，访问路径 /uploads/xxx.webp
media_folder: public/uploads
public_folder: /uploads

# 上传时自动压缩，避免仓库膨胀
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 82
  strip_metadata: true
  width: 1600

slug:
  encoding: unicode
  sanitize_replacement: '-'

collections:
  - name: posts_suibi
    label: 随笔
    label_singular: 随笔
    description: 生活随笔、读书观影、随想
    folder: 'src/content/posts/随笔'
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: [date, title]
    view_filters:
      - label: 草稿箱
        field: draft
        pattern: true
    fields:
      - label: 标题
        name: title
        widget: string
        hint: 建议 15 字以内，会用于生成网址
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 一句话概括，显示在首页列表
      - label: 发布日期
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
      - label: 栏目
        name: category
        widget: hidden
        default: 随笔
      - label: 标签
        name: tags
        widget: list
        required: false
        allow_add: true
        field: { label: 标签, name: tag, widget: string }
        hint: 回车确认，可加多个
      - label: 封面图
        name: cover
        widget: image
        required: false
        hint: 可留空，留空则用随机图或纯文字展示
      - label: 正文
        name: body
        widget: markdown
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 勾选后不会出现在网站上

  - name: photos
    label: 相册
    label_singular: 照片
    description: 首页「相册」页面里的照片，可上传、排序、删除
    folder: 'src/content/photos'
    create: true
    delete: true
    extension: yml
    format: yaml
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: [order, title]
    fields:
      - label: 标题
        name: title
        widget: string
        hint: 照片的简短名字，显示在图片下方
      - label: 拍摄时间
        name: date
        widget: string
        required: false
        default: ''
        hint: 随便写，例如 2026-08 或 2026年夏
      - label: 图片
        name: image
        widget: image
        hint: 从媒体库选择，或直接上传新照片
      - label: 图片说明
        name: alt
        widget: text
        required: false
        default: ''
        hint: 描述画面内容，无障碍与 SEO 都会用到
      - label: 排序
        name: order
        widget: number
        required: false
        default: 100
        help: 数字越小越靠前；留空按 100 处理

  - name: posts_tech
    label: 项目经验
    label_singular: 项目经验
    description: 项目复盘、技术总结、踩坑记录
    folder: 'src/content/posts/项目经验'
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: [date, title]
    view_filters:
      - label: 草稿箱
        field: draft
        pattern: true
    fields:
      - label: 标题
        name: title
        widget: string
        hint: 建议 15 字以内，会用于生成网址
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 一句话概括，显示在首页列表
      - label: 发布日期
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: false
      - label: 栏目
        name: category
        widget: hidden
        default: 项目经验
      - label: 标签
        name: tags
        widget: list
        required: false
        allow_add: true
        field: { label: 标签, name: tag, widget: string }
        hint: 回车确认，可加多个
      - label: 封面图
        name: cover
        widget: image
        required: false
      - label: 正文
        name: body
        widget: markdown
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 勾选后不会出现在网站上